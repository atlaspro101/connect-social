<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Звонок - Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            height: 100vh;
            overflow: hidden;
        }
        .call-container { height: 100vh; display: flex; flex-direction: column; position: relative; }
        .remote-video { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .remote-avatar { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: bold; color: white; }
        .call-info { position: absolute; top: 20px; left: 0; right: 0; text-align: center; background: rgba(0,0,0,0.5); padding: 15px; z-index: 10; }
        .call-info h2 { color: white; font-size: 20px; }
        .call-info p { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 5px; }
        .call-controls { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; padding: 20px; background: rgba(0,0,0,0.6); z-index: 20; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .call-btn:hover { transform: scale(1.1); }
        .call-btn.end { background: #ff4757; color: white; width: 70px; height: 70px; }
        .call-timer { position: absolute; bottom: 120px; left: 20px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; color: white; font-size: 14px; z-index: 10; }
        @media (max-width: 768px) {
            .call-btn { width: 50px; height: 50px; font-size: 22px; }
            .call-btn.end { width: 60px; height: 60px; }
        }
        .connecting { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="remote-video" id="remoteVideo">
            <div class="remote-avatar" id="remoteAvatar">{{ other_username[0].upper() }}</div>
        </div>
        <div class="call-info">
            <h2 id="callerName">{{ other_username }}</h2>
            <p id="callStatus" class="connecting">Соединение...</p>
        </div>
        <div class="call-timer" id="callTimer">00:00</div>
        <div class="call-controls">
            <button class="call-btn end" onclick="endCall()">📞</button>
        </div>
    </div>
    
    <script>
        let callId = {{ call_id }};
        let isCaller = {{ is_caller|lower }};
        let callStartTime = null;
        let timerInterval = null;
        let checkInterval = null;
        
        const callStatus = document.getElementById('callStatus');
        const callTimer = document.getElementById('callTimer');
        
        // Функция для проверки статуса звонка
        function checkCallStatus() {
            fetch('/api/call/check')
                .then(response => response.json())
                .then(data => {
                    if (data.call && data.call.id == callId) {
                        if (data.call.status === 'active') {
                            // Звонок принят
                            callStatus.textContent = 'Разговор';
                            callStatus.classList.remove('connecting');
                            startTimer();
                            if (checkInterval) clearInterval(checkInterval);
                        } else if (data.call.status === 'ended' || data.call.status === 'missed') {
                            // Звонок завершен
                            endCall();
                        }
                    } else if (isCaller) {
                        // Если мы инициатор и звонка нет - возможно он был отклонен
                        callStatus.textContent = 'Ожидание ответа...';
                    }
                });
        }
        
        // Если мы инициатор, ждем ответа
        if (isCaller) {
            callStatus.textContent = 'Звоним...';
            // Проверяем статус каждую секунду
            checkInterval = setInterval(checkCallStatus, 1000);
            
            // Автоматически завершаем через 30 секунд без ответа
            setTimeout(() => {
                fetch('/api/call/check')
                    .then(r => r.json())
                    .then(data => {
                        if (data.call && data.call.id == callId && data.call.status === 'waiting') {
                            endCall();
                            alert('Абонент не ответил');
                        }
                    });
            }, 30000);
        } else {
            // Если мы получатель, сразу показываем ожидание
            callStatus.textContent = 'Входящий звонок...';
            checkInterval = setInterval(checkCallStatus, 1000);
            
            // Спрашиваем ответ через 2 секунды
            setTimeout(() => {
                const accept = confirm('Входящий звонок от ' + document.getElementById('callerName').innerText + '. Принять?');
                if (accept) {
                    fetch('/api/call/accept', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ call_id: callId })
                    }).then(() => {
                        callStatus.textContent = 'Разговор';
                        callStatus.classList.remove('connecting');
                        startTimer();
                    });
                } else {
                    fetch('/api/call/reject', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ call_id: callId })
                    }).then(() => endCall());
                }
            }, 2000);
        }
        
        function startTimer() {
            callStartTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                callTimer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        function endCall() {
            if (timerInterval) clearInterval(timerInterval);
            if (checkInterval) clearInterval(checkInterval);
            
            fetch('/api/call/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ call_id: callId })
            }).catch(() => {});
            
            setTimeout(() => window.close(), 500);
        }
        
        // Закрытие окна при завершении
        window.addEventListener('beforeunload', () => {
            fetch('/api/call/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ call_id: callId })
            }).catch(() => {});
        });
    </script>
</body>
</html>
