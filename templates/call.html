<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Звонок - Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .call-card {
            background: rgba(25,35,50,0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .call-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
        }
        .call-name { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .call-status { color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .call-timer { font-size: 32px; font-family: monospace; margin-bottom: 30px; color: #4cd964; }
        .call-buttons { display: flex; gap: 20px; justify-content: center; }
        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .call-btn:active { transform: scale(0.95); }
        .call-btn.end { background: #ff4757; color: white; }
        .call-btn.accept { background: #4cd964; color: white; }
        .status-waiting { color: #ffa502; }
        .status-active { color: #4cd964; }
    </style>
</head>
<body>
    <div class="call-card">
        <div class="call-avatar" id="avatar">{{ other_username[0].upper() }}</div>
        <div class="call-name" id="callerName">{{ other_username }}</div>
        <div class="call-status" id="callStatus">
            {% if is_caller %}Звоним...{% else %}Входящий звонок{% endif %}
        </div>
        <div class="call-timer" id="callTimer" style="display: none;">00:00</div>
        <div class="call-buttons" id="callButtons">
            {% if is_caller %}
                <button class="call-btn end" onclick="endCall()">📞</button>
            {% else %}
                <button class="call-btn accept" onclick="acceptCall()">📞</button>
                <button class="call-btn end" onclick="rejectCall()">❌</button>
            {% endif %}
        </div>
    </div>

    <script>
        let callId = {{ call_id }};
        let isCaller = {{ is_caller|lower }};
        let timerInterval = null;
        let callActive = false;
        let checkInterval = null;

        const callStatus = document.getElementById('callStatus');
        const callTimer = document.getElementById('callTimer');
        
        function checkCallStatus() {
            fetch('/api/call/check')
                .then(r => r.json())
                .then(data => {
                    if (data.call && data.call.id == callId) {
                        if (data.call.status === 'active' && !callActive) {
                            callActive = true;
                            callStatus.textContent = 'Разговор';
                            callStatus.className = 'call-status status-active';
                            startTimer();
                            if (checkInterval) clearInterval(checkInterval);
                        } else if (data.call.status === 'ended' || data.call.status === 'missed') {
                            endCall();
                        }
                    } else if (!data.call && !isCaller && !callActive) {
                        // Звонок был отклонен
                        callStatus.textContent = 'Звонок завершен';
                        setTimeout(() => window.close(), 2000);
                        if (checkInterval) clearInterval(checkInterval);
                    }
                })
                .catch(() => {});
        }

        function acceptCall() {
            fetch('/api/call/accept', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ call_id: callId })
            }).then(() => {
                callActive = true;
                callStatus.textContent = 'Разговор';
                callStatus.className = 'call-status status-active';
                startTimer();
                document.getElementById('callButtons').innerHTML = '<button class="call-btn end" onclick="endCall()">📞</button>';
                if (checkInterval) clearInterval(checkInterval);
            });
        }

        function rejectCall() {
            fetch('/api/call/reject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ call_id: callId })
            }).then(() => window.close());
        }

        function endCall() {
            fetch('/api/call/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ call_id: callId })
            }).catch(() => {});
            if (timerInterval) clearInterval(timerInterval);
            setTimeout(() => window.close(), 500);
        }

        function startTimer() {
            let seconds = 0;
            callTimer.style.display = 'block';
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                callTimer.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Запускаем проверку статуса
        checkInterval = setInterval(checkCallStatus, 2000);
        
        // Если инициатор - автоматически завершаем через 30 секунд
        if (isCaller) {
            setTimeout(() => {
                if (!callActive) {
                    endCall();
                }
            }, 30000);
        }
    </script>
</body>
</html>
