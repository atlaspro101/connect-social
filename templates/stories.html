<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Сторис - Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .story-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-viewer {
            position: relative;
            max-width: 400px;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .story-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .story-progress {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }
        .story-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .story-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #667eea;
        }
        .story-username {
            color: white;
            font-weight: bold;
            text-shadow: 0 1px 2px black;
        }
        .close-story {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 1px 2px black;
        }
        .reaction-bar {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        .reaction-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            font-size: 32px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .reaction-btn:active {
            transform: scale(1.2);
        }
        .story-text {
            position: absolute;
            bottom: 100px;
            left: 20px;
            right: 20px;
            color: white;
            text-align: center;
            font-size: 18px;
            text-shadow: 0 1px 2px black;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 20px;
        }
        .tap-left, .tap-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
        }
        .tap-left { left: 0; }
        .tap-right { right: 0; }
    </style>
</head>
<body>
    <div class="story-container" id="storyContainer">
        <div class="story-viewer" id="storyViewer">
            <div class="tap-left" id="tapLeft"></div>
            <div class="tap-right" id="tapRight"></div>
            <div class="story-progress" id="storyProgress"></div>
            <div class="story-header" id="storyHeader"></div>
            <button class="close-story" onclick="closeStories()">✕</button>
            <div class="reaction-bar" id="reactionBar"></div>
            <div class="story-text" id="storyText"></div>
            <img class="story-media" id="storyMedia" style="display: none;">
            <video class="story-media" id="storyVideo" style="display: none;" autoplay muted playsinline></video>
        </div>
    </div>

    <script>
        let storiesData = [];
        let currentUserIndex = 0;
        let currentStoryIndex = 0;
        let progressInterval = null;
        let currentVideo = null;
        
        async function loadStories() {
            try {
                const response = await fetch('/api/stories');
                const data = await response.json();
                if (data.success && data.stories && data.stories.length > 0) {
                    storiesData = data.stories;
                    showStory(0, 0);
                } else {
                    alert('Нет активных историй');
                    window.location.href = '/feed';
                }
            } catch(e) {
                console.error(e);
                window.location.href = '/feed';
            }
        }
        
        function showStory(userIdx, storyIdx) {
            if (progressInterval) clearInterval(progressInterval);
            if (currentVideo) {
                currentVideo.pause();
                currentVideo.currentTime = 0;
            }
            
            const user = storiesData[userIdx];
            const story = user.stories[storyIdx];
            
            // Обновляем прогресс-бары
            const progressBars = document.getElementById('storyProgress');
            progressBars.innerHTML = user.stories.map((s, i) => `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${i < storyIdx ? '100%' : i === storyIdx ? '0%' : '0%'}"></div>
                </div>
            `).join('');
            
            // Обновляем заголовок
            document.getElementById('storyHeader').innerHTML = `
                <img src="${user.user.avatar || '/static/default-avatar.png'}" class="story-avatar" onerror="this.src='/static/default-avatar.png'">
                <span class="story-username">${user.user.full_name || user.user.username}</span>
            `;
            document.getElementById('storyText').textContent = story.text || '';
            
            // Обновляем реакции
            document.getElementById('reactionBar').innerHTML = `
                <button class="reaction-btn" onclick="addReaction(${story.id}, '❤️')">❤️</button>
                <button class="reaction-btn" onclick="addReaction(${story.id}, '😂')">😂</button>
                <button class="reaction-btn" onclick="addReaction(${story.id}, '😮')">😮</button>
                <button class="reaction-btn" onclick="addReaction(${story.id}, '😢')">😢</button>
                <button class="reaction-btn" onclick="addReaction(${story.id}, '🔥')">🔥</button>
            `;
            
            // Показываем медиа
            if (story.media_type === 'video') {
                document.getElementById('storyMedia').style.display = 'none';
                const video = document.getElementById('storyVideo');
                video.style.display = 'block';
                video.src = story.media_path;
                video.load();
                video.play();
                currentVideo = video;
                
                video.addEventListener('timeupdate', function onTimeUpdate() {
                    const percent = (video.currentTime / video.duration) * 100;
                    const fill = document.querySelectorAll('.progress-fill')[storyIdx];
                    if (fill) fill.style.width = `${percent}%`;
                });
                video.addEventListener('ended', function onEnded() {
                    video.removeEventListener('timeupdate', onTimeUpdate);
                    video.removeEventListener('ended', onEnded);
                    nextStory();
                });
            } else {
                document.getElementById('storyVideo').style.display = 'none';
                const img = document.getElementById('storyMedia');
                img.style.display = 'block';
                img.src = story.media_path;
                startImageTimer(story.id, storyIdx);
            }
            
            // Отмечаем просмотр
            fetch(`/api/stories/${story.id}/view`, { method: 'POST' }).catch(e => console.log);
        }
        
        function startImageTimer(storyId, storyIdx) {
            let duration = 5000;
            let startTime = Date.now();
            
            progressInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let percent = (elapsed / duration) * 100;
                const fill = document.querySelectorAll('.progress-fill')[storyIdx];
                if (fill) fill.style.width = `${Math.min(percent, 100)}%`;
                
                if (elapsed >= duration) {
                    clearInterval(progressInterval);
                    nextStory();
                }
            }, 50);
        }
        
        function nextStory() {
            const user = storiesData[currentUserIndex];
            if (currentStoryIndex + 1 < user.stories.length) {
                currentStoryIndex++;
                showStory(currentUserIndex, currentStoryIndex);
            } else if (currentUserIndex + 1 < storiesData.length) {
                currentUserIndex++;
                currentStoryIndex = 0;
                showStory(currentUserIndex, currentStoryIndex);
            } else {
                closeStories();
            }
        }
        
        function prevStory() {
            if (currentStoryIndex > 0) {
                currentStoryIndex--;
                showStory(currentUserIndex, currentStoryIndex);
            } else if (currentUserIndex > 0) {
                currentUserIndex--;
                currentStoryIndex = storiesData[currentUserIndex].stories.length - 1;
                showStory(currentUserIndex, currentStoryIndex);
            } else {
                closeStories();
            }
        }
        
        async function addReaction(storyId, reaction) {
            try {
                await fetch(`/api/stories/${storyId}/react`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reaction })
                });
                const btn = event.target;
                btn.style.transform = 'scale(1.3)';
                setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200);
            } catch(e) { console.log(e); }
        }
        
        function closeStories() {
            if (progressInterval) clearInterval(progressInterval);
            window.location.href = '/feed';
        }
        
        // Навигация
        document.getElementById('tapLeft').addEventListener('click', (e) => {
            e.stopPropagation();
            prevStory();
        });
        document.getElementById('tapRight').addEventListener('click', (e) => {
            e.stopPropagation();
            nextStory();
        });
        
        // Загрузка
        loadStories();
    </script>
</body>
</html>
