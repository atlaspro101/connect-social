<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Connect - Социальная сеть</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .animated-bg .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            animation: float 20s infinite ease-in-out;
        }

        .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; animation-delay: 0s; }
        .circle2 { width: 500px; height: 500px; bottom: -200px; right: -200px; animation-delay: 5s; }
        .circle3 { width: 200px; height: 200px; top: 50%; left: 50%; animation-delay: 10s; }
        .circle4 { width: 400px; height: 400px; bottom: 20%; left: -150px; animation-delay: 3s; }
        .circle5 { width: 250px; height: 250px; top: 20%; right: -50px; animation-delay: 7s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Главная карточка */
        .hero-card {
            background: rgba(25, 35, 50, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Логотип */
        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Описание */
        .description {
            margin-bottom: 40px;
        }

        .description h2 {
            color: white;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .description p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Особенности */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .hero-card {
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 36px;
            }
            
            .description h2 {
                font-size: 20px;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 14px;
            }
            
            .features {
                gap: 10px;
            }
            
            .feature {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="circle circle4"></div>
        <div class="circle circle5"></div>
    </div>

    <div class="container">
        <div class="hero-card">
            <div class="logo">
                <h1>✨ Connect</h1>
                <p>Новая эра общения</p>
            </div>

            <div class="description">
                <h2>Добро пожаловать!</h2>
                <p>Присоединяйтесь к нашему сообществу. Делитесь мыслями, общайтесь с друзьями и будьте в курсе событий.</p>
            </div>

            <div class="features">
                <div class="feature">📱 Удобный интерфейс</div>
                <div class="feature">⚡ Быстрые сообщения</div>
                <div class="feature">🔒 Безопасность</div>
                <div class="feature">🎨 Красивый дизайн</div>
            </div>

            <div class="buttons">
                <a href="/login" class="btn btn-primary">🔐 Вход</a>
                <a href="/register" class="btn btn-secondary">📝 Регистрация</a>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="userCount">0</div>
                    <div class="stat-label">пользователей</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="postCount">0</div>
                    <div class="stat-label">постов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">24/7</div>
                    <div class="stat-label">онлайн</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Загружаем статистику
        fetch('/api/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('userCount').textContent = data.users || 0;
                document.getElementById('postCount').textContent = data.posts || 0;
            })
            .catch(() => {
                // Если API нет, показываем примерные цифры
                document.getElementById('userCount').textContent = '1k+';
                document.getElementById('postCount').textContent = '5k+';
            });
    </script>
</body>
</html>
