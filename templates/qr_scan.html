<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Подтверждение входа - Connect</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-container {
            background: rgba(25, 35, 50, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
        }
        .confirm-btn {
            background: linear-gradient(135deg, #4cd964, #34c759);
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .cancel-btn {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 12px 30px;
            border-radius: 30px;
            color: #ff4757;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-message {
            color: #4cd964;
            margin-top: 10px;
        }
        .info-text {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="confirm-container" id="confirmContainer">
        <div class="user-avatar" id="userAvatar">?</div>
        <h2 id="userName">Загрузка...</h2>
        <p id="userLogin">@username</p>
        <button class="confirm-btn" id="confirmBtn" onclick="confirmLogin()">✅ Подтвердить вход</button>
        <button class="cancel-btn" onclick="window.close()">❌ Отмена</button>
        <div id="successMessage" style="display:none;" class="success-message"></div>
        <div class="info-text">
            После подтверждения вы будете автоматически перенаправлены в ленту
        </div>
    </div>

    <script>
        const sessionId = '{{ session_id }}';
        let isLoading = false;
        let loginCompleted = false;

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/me');
                const data = await response.json();
                if (data.user) {
                    document.getElementById('userAvatar').textContent = data.user.username[0].toUpperCase();
                    document.getElementById('userName').textContent = data.user.full_name || data.user.username;
                    document.getElementById('userLogin').textContent = '@' + data.user.username;
                } else {
                    // Если не залогинены, пробуем получить из localStorage
                    const savedUser = localStorage.getItem('currentUser');
                    if (savedUser) {
                        const user = JSON.parse(savedUser);
                        document.getElementById('userAvatar').textContent = user.username[0].toUpperCase();
                        document.getElementById('userName').textContent = user.full_name || user.username;
                        document.getElementById('userLogin').textContent = '@' + user.username;
                    }
                }
            } catch(e) {
                console.log('Error loading user info');
            }
        }

        async function confirmLogin() {
            if (isLoading || loginCompleted) return;
            isLoading = true;
            const btn = document.getElementById('confirmBtn');
            btn.innerHTML = '<span class="loading"></span> Подтверждение...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/qr/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await response.json();
                
                if (data.success) {
                    loginCompleted = true;
                    btn.innerHTML = '✅ Вход подтвержден!';
                    btn.style.background = '#4cd964';
                    
                    const successMsg = document.getElementById('successMessage');
                    successMsg.style.display = 'block';
                    successMsg.innerHTML = '✅ Вход выполнен успешно! Перенаправление...';
                    
                    // Сохраняем информацию о пользователе
                    if (data.user_id && data.username) {
                        localStorage.setItem('currentUser', JSON.stringify({
                            id: data.user_id,
                            username: data.username
                        }));
                    }
                    
                    // Перенаправляем через 1 секунду на feed
                    setTimeout(() => {
                        window.location.href = '/feed';
                    }, 1000);
                } else {
                    btn.innerHTML = '❌ Ошибка. Попробуйте снова';
                    btn.style.background = '#ff4757';
                    isLoading = false;
                    btn.disabled = false;
                }
            } catch(e) {
                btn.innerHTML = '❌ Ошибка соединения';
                console.error('Confirm error:', e);
                isLoading = false;
                btn.disabled = false;
            }
        }

        loadUserInfo();
        
        // Автоматически пробуем подтвердить через API если уже залогинены
        setTimeout(() => {
            if (!loginCompleted && !isLoading) {
                confirmLogin();
            }
        }, 1000);
    </script>
</body>
</html>
