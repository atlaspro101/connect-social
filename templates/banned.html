<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт заблокирован - Connect</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .ban-container {
            max-width: 500px;
            background: rgba(20, 30, 45, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        
        .ban-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ff4757;
            margin-bottom: 16px;
        }
        
        .ban-reason {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            color: #ff4757;
        }
        
        .ban-until {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="ban-container">
        <div class="ban-icon">🚫</div>
        <h1>Аккаунт заблокирован</h1>
        <p>Ваш аккаунт был заблокирован администрацией.</p>
        
        <div class="ban-reason">
            <strong>Причина блокировки:</strong><br>
            {{ ban.reason }}
        </div>
        
        <div class="ban-until">
            ⏰ Блокировка истекает: {{ ban.until.strftime('%d.%m.%Y %H:%M') if ban.until else 'навсегда' }}
        </div>
        
        <a href="/login" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
