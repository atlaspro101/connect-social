<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Connect">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="theme-color" content="#667eea">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация - Connect</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 550px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-card {
            background: rgba(25, 35, 50, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 8px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .title p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(0, 0, 0, 0.4);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        textarea.input-field {
            padding: 14px 16px;
            resize: vertical;
            min-height: 80px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
        }

        .gender-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .file-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .file-input::-webkit-file-upload-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-right: 12px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .qr-register-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .qr-register-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff4757;
            font-size: 14px;
            text-align: center;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 28px;
            }
            .title h2 {
                font-size: 20px;
            }
            .gender-group {
                gap: 15px;
            }
            .row-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <h1>✨ Connect</h1>
                <p>Присоединяйтесь к нам</p>
            </div>

            <div class="title">
                <h2>📝 Создать аккаунт</h2>
                <p>Заполните форму ниже</p>
            </div>

            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <span>👤</span>
                            <input type="text" name="username" class="input-field" placeholder="Имя пользователя *" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <span>🔒</span>
                            <input type="password" name="password" class="input-field" placeholder="Пароль *" required>
                        </div>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <span>📧</span>
                            <input type="email" name="email" class="input-field" placeholder="Email">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <span>📱</span>
                            <input type="tel" name="phone" class="input-field" placeholder="Телефон">
                        </div>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <span>📛</span>
                            <input type="text" name="full_name" class="input-field" placeholder="Полное имя">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <span>📅</span>
                            <input type="date" name="birthday" class="input-field">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <span style="color: rgba(255,255,255,0.7); font-size: 14px; display: block; margin-bottom: 8px;">⚥ Пол</span>
                    <div class="gender-group">
                        <label class="gender-label">
                            <input type="radio" name="gender" value="male"> Мужской
                        </label>
                        <label class="gender-label">
                            <input type="radio" name="gender" value="female"> Женский
                        </label>
                        <label class="gender-label">
                            <input type="radio" name="gender" value="other"> Другой
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <textarea name="bio" class="input-field" placeholder="📝 О себе" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <input type="file" name="avatar" class="file-input" accept="image/*">
                </div>

                <button type="submit" class="btn-register">Зарегистрироваться 🚀</button>
            </form>

            <div class="login-link">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>

            <a href="/qr-login" class="qr-register-btn">
                📱 Войти через QR-код
            </a>
        </div>
    </div>
</body>
</html>
