<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация - Connect</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Прелоадер */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-content {
            text-align: center;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .preloader-logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .preloader-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 12px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .register-container {
            width: 100%;
            max-width: 550px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-card {
            background: rgba(25, 35, 50, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 8px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .title p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(0, 0, 0, 0.4);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        textarea.input-field {
            padding: 14px 16px;
            resize: vertical;
            min-height: 80px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
        }

        .gender-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .file-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .file-input::-webkit-file-upload-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-right: 12px;
        }

        .captcha-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .captcha-code {
            font-size: 28px;
            letter-spacing: 8px;
            font-family: monospace;
            background: #1a1a2e;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            color: #667eea;
        }

        .captcha-input {
            width: 200px;
            display: inline-block;
            margin-right: 10px;
        }

        .refresh-captcha {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            vertical-align: middle;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff4757;
            font-size: 14px;
            text-align: center;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 28px;
            }
            .title h2 {
                font-size: 20px;
            }
            .gender-group {
                gap: 15px;
            }
            .row-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Прелоадер -->
    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">Connect</div>
            <div class="preloader-text">Загрузка...</div>
        </div>
    </div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <h1>Connect</h1>
                <p>Присоединяйтесь к нам</p>
            </div>

            <div class="title">
                <h2>Создать аккаунт</h2>
                <p>Заполните форму ниже</p>
            </div>

            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" id="registerForm">
                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" name="username" class="input-field" placeholder="Имя пользователя *" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" name="password" class="input-field" placeholder="Пароль *" required>
                        </div>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input type="email" name="email" class="input-field" placeholder="Email">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                                <line x1="12" y1="18" x2="12.01" y2="18"/>
                            </svg>
                            <input type="tel" name="phone" class="input-field" placeholder="Телефон">
                        </div>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" name="full_name" class="input-field" placeholder="Полное имя">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            <input type="date" name="birthday" class="input-field">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <span style="color: rgba(255,255,255,0.7); font-size: 14px; display: block; margin-bottom: 8px;">Пол</span>
                    <div class="gender-group">
                        <label class="gender-label">
                            <input type="radio" name="gender" value="male"> Мужской
                        </label>
                        <label class="gender-label">
                            <input type="radio" name="gender" value="female"> Женский
                        </label>
                        <label class="gender-label">
                            <input type="radio" name="gender" value="other"> Другой
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <textarea name="bio" class="input-field" placeholder="О себе" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <input type="file" name="avatar" class="file-input" accept="image/*">
                </div>

                <div class="form-group">
                    <div class="captcha-container">
                        <div class="captcha-code" id="captchaCode"></div>
                        <div style="margin-top: 12px;">
                            <input type="text" id="captchaInput" placeholder="Введите код с картинки" class="input-field captcha-input">
                            <button type="button" class="refresh-captcha" onclick="refreshCaptcha()">🔄</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">Зарегистрироваться</button>
            </form>

            <div class="login-link">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </div>

    <script>
        // Прелоадер
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            document.body.classList.add('loaded');
            setTimeout(function() {
                preloader.classList.add('fade-out');
                setTimeout(function() {
                    preloader.style.display = 'none';
                }, 500);
            }, 300);
        });

        let captchaValue = '';
        
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            let captcha = '';
            for(let i = 0; i < 6; i++) {
                captcha += chars[Math.floor(Math.random() * chars.length)];
            }
            captchaValue = captcha;
            document.getElementById('captchaCode').textContent = captcha;
        }
        
        function refreshCaptcha() {
            generateCaptcha();
        }
        
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const captchaInput = document.getElementById('captchaInput');
            if (captchaInput.value !== captchaValue) {
                e.preventDefault();
                alert('Неверный код капчи! Пожалуйста, введите код с картинки.');
                refreshCaptcha();
                captchaInput.value = '';
                return false;
            }
        });
        
        generateCaptcha();
    </script>
</body>
</html>
